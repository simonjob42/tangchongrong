services:
  - type: web
    name: tang-chongrong
    runtime: node
    # Starter：0.5 CPU / 512 MB，常驻不休眠（免费实例闲置 15 分钟后会挂起）
    plan: starter
    region: singapore
    branch: master
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # 自定义域名；本地默认值见 src/components/sites/tang-chongrong/data/site.ts
      - key: NEXT_PUBLIC_SITE_URL
        value: https://beyondonline.org
